services:
  - type: web
    name: chhatak-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # DATABASE_URL is set manually in the Render dashboard because free tier
      # only allows one Postgres DB per account (we reuse an existing one).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://chhatak.onrender.com
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: chhatak
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://chhatak-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
