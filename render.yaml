services:
  - type: web
    name: chhatak-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # DATABASE_URL is set manually in the Render dashboard because free tier
      # only allows one Postgres DB per account (we reuse an existing one).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://chhatak.onrender.com
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Razorpay — set these in the Render dashboard (never commit real keys).
      # Get them from https://dashboard.razorpay.com → Account & Settings → API Keys.
      # For live payments use rzp_live_*; for testing use rzp_test_*.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Webhook signing secret from Razorpay Dashboard → Settings → Webhooks.
      # Configure the webhook to POST to https://chhatak-api.onrender.com/api/v1/payments/webhook
      # subscribed to at minimum: payment.captured, payment.failed, order.paid
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: chhatak
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://chhatak-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
