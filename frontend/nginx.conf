server {
    listen 80;
    server_name chhatak.in www.chhatak.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chhatak.in www.chhatak.in;
    client_max_body_size 512M;

    ssl_certificate     /etc/letsencrypt/live/chhatak.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chhatak.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SEO / verification files — serve as their real MIME type, never fall back to index.html
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /BingSiteAuth.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }
    location ~ ^/google[0-9a-f]+\.html$ {
        root /usr/share/nginx/html;
        default_type text/html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
